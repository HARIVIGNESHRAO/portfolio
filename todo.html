<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Interactive To-Do List - Hari Vignesh Rao">
    <title>To-Do List | Hari Vignesh Rao</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav aria-label="Main Navigation">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="todo.html" aria-current="page">To-Do App</a></li>
            </ul>
            <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle Dark Mode">🌙</button>
        </nav>
    </header>

    <main>
        <section class="todo-section">
            <h1>Task Manager</h1>

            <!-- Add Task -->
            <div class="add-task">
                <input type="text" id="taskInput" placeholder="What needs to be done?" aria-label="New task">
                <button onclick="addTask()">Add Task</button>
            </div>

            <!-- Filters -->
            <div class="filters">
                <button onclick="filterTasks('all')" class="active" id="filter-all">All</button>
                <button onclick="filterTasks('active')" id="filter-active">Active</button>
                <button onclick="filterTasks('completed')" id="filter-completed">Completed</button>
            </div>

            <!-- Task List -->
            <ul id="taskList" class="task-list"></ul>

            <!-- Stats -->
            <div class="stats" id="stats"></div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Hari Vignesh Rao. All Rights Reserved.</p>
    </footer>

    <script>
        // Load tasks from localStorage
        let tasks = JSON.parse(localStorage.getItem('tasks')) || [];

        function saveTasks() {
            localStorage.setItem('tasks', JSON.stringify(tasks));
        }

        function renderTasks(filteredTasks = tasks) {
            const taskList = document.getElementById('taskList');
            taskList.innerHTML = '';

            filteredTasks.forEach((task, index) => {
                const li = document.createElement('li');
                li.className = `task-item ${task.completed ? 'completed' : ''}`;
                li.innerHTML = `
                    <input type="checkbox" ${task.completed ? 'checked' : ''}
                           onchange="toggleComplete(${index})">
                    <span>${task.text}</span>
                    <div class="actions">
                        <button onclick="editTask(${index})">✏️</button>
                        <button onclick="deleteTask(${index})">🗑️</button>
                    </div>
                `;
                taskList.appendChild(li);
            });

            updateStats();
        }

        function addTask() {
            const input = document.getElementById('taskInput');
            const text = input.value.trim();

            if (text === '') return;

            tasks.push({ text: text, completed: false });
            saveTasks();
            renderTasks();
            input.value = '';
        }

        function toggleComplete(index) {
            tasks[index].completed = !tasks[index].completed;
            saveTasks();
            renderTasks();
        }

        function deleteTask(index) {
            tasks.splice(index, 1);
            saveTasks();
            renderTasks();
        }

        function editTask(index) {
            const newText = prompt("Edit task:", tasks[index].text);
            if (newText !== null && newText.trim() !== '') {
                tasks[index].text = newText.trim();
                saveTasks();
                renderTasks();
            }
        }

        function filterTasks(filter) {
            let filtered = tasks;

            if (filter === 'active') {
                filtered = tasks.filter(t => !t.completed);
            } else if (filter === 'completed') {
                filtered = tasks.filter(t => t.completed);
            }

            // Update active button
            document.querySelectorAll('.filters button').forEach(btn => {
                btn.classList.remove('active');
                if (btn.id === `filter-${filter}`) btn.classList.add('active');
            });

            renderTasks(filtered);
        }

        function updateStats() {
            const total = tasks.length;
            const completed = tasks.filter(t => t.completed).length;
            document.getElementById('stats').innerHTML = `
                ${total} tasks total | ${completed} completed
            `;
        }

        // Keyboard support
        document.getElementById('taskInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') addTask();
        });

        // Initial render
        renderTasks();
    </script>
</body>
</html>
